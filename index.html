<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="description" content="Neom Villa staff invoicing, pricing and availability manager" />
<title>Neom Villa — Invoice Manager</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/invoice.css" />
<link rel="stylesheet" href="css/prices.css" />
<link rel="stylesheet" href="css/availability.css" />
<link rel="stylesheet" href="css/summary.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div id="app" class="app-shell">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true">NV</span>
      <div class="brand-text">
        <span class="brand-name">NEOM VILLA</span>
        <span class="brand-sub">Staff Console</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-status" id="connection-status" title="Supabase connection status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label">Connecting…</span>
      </div>
      <div class="topbar-auth">
        <span class="role-badge" id="role-badge"></span>
        <button class="btn btn-sm btn-ghost" id="btn-logout" type="button">Switch User</button>
      </div>
    </div>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Main navigation">
    <button class="tab-btn active" type="button" data-tab="invoice" role="tab" aria-selected="true" aria-controls="tab-invoice">
      <span class="tab-btn-ar">فاتورة</span>
      <span class="tab-btn-en">Invoice</span>
    </button>
    <button class="tab-btn" type="button" data-tab="prices" role="tab" aria-selected="false" aria-controls="tab-prices">
      <span class="tab-btn-ar">اسعار</span>
      <span class="tab-btn-en">Prices</span>
    </button>
    <button class="tab-btn" type="button" data-tab="availability" role="tab" aria-selected="false" aria-controls="tab-availability">
      <span class="tab-btn-ar">توافرات</span>
      <span class="tab-btn-en">Availability</span>
    </button>
    <button class="tab-btn" type="button" data-tab="summary" role="tab" aria-selected="false" aria-controls="tab-summary">
      <span class="tab-btn-ar">ملخص</span>
      <span class="tab-btn-en">Summary</span>
    </button>
  </nav>

  <main class="tab-content">
    <section id="tab-invoice" class="tab-panel active" data-panel="invoice" role="tabpanel"></section>
    <section id="tab-prices" class="tab-panel" data-panel="prices" role="tabpanel" hidden></section>
    <section id="tab-availability" class="tab-panel" data-panel="availability" role="tabpanel" hidden></section>
    <section id="tab-summary" class="tab-panel" data-panel="summary" role="tabpanel" hidden></section>
  </main>
</div>

<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
<div id="modal-root"></div>

<!-- Third-party libraries (UMD builds, pinned versions) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
